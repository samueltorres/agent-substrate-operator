version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  # Kubernetes, controller-runtime, and kustomize move together, and with the
  # embedded Substrate release, so they are bumped by hand. Dependabot only
  # proposes Kubernetes and controller-runtime patch releases. kustomize gets
  # none: its patch releases pull in a kube-openapi built for the next
  # Kubernetes minor.
  ignore:
  - dependency-name: "k8s.io/*"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - dependency-name: "sigs.k8s.io/controller-runtime"
    update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - dependency-name: "sigs.k8s.io/kustomize/*"
  groups:
    kubernetes:
      patterns:
      - "k8s.io/*"
      - "sigs.k8s.io/*"
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions:
      patterns: ["*"]
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
