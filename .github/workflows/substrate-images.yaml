# Publishes the Agent Substrate images the operator installs by default.
# Upstream publishes none, so this rebuilds the embedded release from its
# upstream tag with upstream's own `ate-setup publish release-images`, on a
# native runner per architecture, merges the two into multi-architecture tags,
# and signs them. A release whose images exist is left alone: tags are never
# overwritten.
name: substrate-images

on:
  push:
    branches: [main]
    paths: [internal/upstream/files/VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substrate-images

env:
  REPOSITORY: ghcr.io/${{ github.repository_owner }}/substrate

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      published: ${{ steps.plan.outputs.published }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: plan
      run: |
        version="$(cat internal/upstream/files/VERSION)"
        echo "version=${version}" >>"${GITHUB_OUTPUT}"
        if docker buildx imagetools inspect "${REPOSITORY}/ateapi:${version}" >/dev/null 2>&1; then
          echo "published=true" >>"${GITHUB_OUTPUT}"
          echo "::notice::${REPOSITORY} already has ${version}; not rebuilding"
        fi

  build:
    needs: plan
    if: needs.plan.outputs.published != 'true'
    strategy:
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-latest
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: agent-substrate/substrate
        ref: ${{ needs.plan.outputs.version }}
        path: _upstream
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: _upstream/go.mod
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: hack/publish-substrate-images.sh _upstream "${REPOSITORY}" "linux/${{ matrix.arch }}"
      env:
        TAG: ${{ needs.plan.outputs.version }}-${{ matrix.arch }}
        REFS_FILE: refs-${{ matrix.arch }}.txt
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: refs-${{ matrix.arch }}
        path: refs-${{ matrix.arch }}.txt

  merge:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: refs-*
        merge-multiple: true
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - run: hack/merge-substrate-images.sh "${REPOSITORY}" "${{ needs.plan.outputs.version }}" refs-*.txt >merged.txt
    - run: xargs --no-run-if-empty -n1 cosign sign --yes <merged.txt
