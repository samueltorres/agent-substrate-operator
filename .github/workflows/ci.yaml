# Pull requests and main run the checks and the kind end-to-end test. Main
# also publishes the operator image as :main; a v* tag publishes it under the
# version, pushes the chart, and creates the GitHub release. Everything
# published is signed with cosign keyless signing.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
    # Regenerates code, CRD, and RBAC and fails if they are stale, then lints
    # and runs the unit and envtest suites.
    - run: make verify
    - run: make vulncheck

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: upstream
      run: echo "version=$(cat internal/upstream/files/VERSION)" >>"${GITHUB_OUTPUT}"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: agent-substrate/substrate
        ref: ${{ steps.upstream.outputs.version }}
        path: _upstream
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
    - run: make e2e UPSTREAM=_upstream

  operator-image:
    needs: [verify, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/agent-substrate-operator
        # The chart defaults the image tag to its version, which has no "v".
        tags: |
          type=ref,event=branch
          type=sha
          type=semver,pattern={{version}}
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        provenance: mode=max
        sbom: true
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/agent-substrate-operator@${{ steps.build.outputs.digest }}"

  release:
    needs: operator-image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - run: helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
    - id: chart
      run: echo "ref=$(hack/release-chart.sh "${GITHUB_REF_NAME}" "oci://ghcr.io/${{ github.repository_owner }}/charts")" >>"${GITHUB_OUTPUT}"
    - run: cosign sign --yes "${{ steps.chart.outputs.ref }}"
    - run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag dist/*.tgz
      env:
        GH_TOKEN: ${{ github.token }}
